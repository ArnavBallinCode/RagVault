name: Evaluation and regression gate

on:
  pull_request:
    paths:
      - 'config/**'
      - 'evaluation/**'
      - 'src/**'
      - 'api_server.py'
      - 'frontend/**'
      - 'Dockerfile.backend'
      - 'docker-compose*.yml'
      - 'docs/DOCKER.md'
      - '.github/workflows/evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compose-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the host-model Compose deployment
        run: docker compose config
      - name: Validate the bundled Linux-GGUF Compose deployment
        env:
          RAGVAULT_GGUF_MODEL: example.gguf
        run: docker compose -f docker-compose.yml -f docker-compose.bundled.yml config

  deterministic-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run deterministic evaluator tests
        run: python -m unittest discover -s tests -v
      - name: Validate agent experiment manifests
        run: python -m evaluation.manifest --directory evaluation/experiments
      - name: Produce a candidate benchmark report
        run: >
          python -m evaluation.run
          --baseline evaluation/baselines/smoke.json
          --max-regression 0.001
          --output-dir evaluation/results
      - name: Gate submitted model/config candidates
        id: candidates
        shell: bash
        run: |
          shopt -s nullglob
          report_predictions="evaluation/fixtures/smoke_predictions.json"
          for candidate in evaluation/candidates/*.json; do
            name="$(basename "$candidate" .json)"
            python -m evaluation.run \
              --predictions "$candidate" \
              --baseline evaluation/baselines/smoke.json \
              --max-regression 0.001 \
              --output-dir "evaluation/results/$name"
            report_predictions="$candidate"
          done
          python -m evaluation.run \
            --predictions "$report_predictions" \
            --baseline evaluation/baselines/smoke.json \
            --max-regression 0.001 \
            --output-dir evaluation/results/pr-candidate
      - name: Build pull-request before/after table
        run: >
          python -m evaluation.report
          --baseline evaluation/baselines/smoke.json
          --candidate evaluation/results/pr-candidate/latest.json
          --max-regression 0.001
          --output evaluation/results/pr-summary.md
      - name: Post evaluation table to pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('evaluation/results/pr-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes('<!-- ragvault-evaluation-report -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
