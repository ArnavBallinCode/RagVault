services:
  llm:
    # llama.cpp's Linux server supports both amd64 and arm64. It needs a GGUF
    # model file; a macOS .llamafile is an executable and cannot run in Docker.
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/${RAGVAULT_GGUF_MODEL:?Set RAGVAULT_GGUF_MODEL to a Linux-compatible GGUF filename}
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --n-gpu-layers
      - "0"
    volumes:
      - ./models:/models:ro
    ports:
      - "8081:8081"
    restart: unless-stopped

  backend:
    environment:
      RAGVAULT_LLM_URL: http://llm:8081
    depends_on:
      llm:
        condition: service_started
